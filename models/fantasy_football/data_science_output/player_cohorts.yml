version: 2

models:
  - name: player_cohorts
    description: >
      Best-ball player cohort exposure per user and season, sourced from
      landing.data_science_output__player_cohorts via data_science_output__player_cohorts.py.
      One row per canonical player cohort (sorted player_ids) for a given
      cohort_size and through-round cutoff. Cohorts with draft_count < 3 are excluded.
    config:
      tags: ['lightdash']
    columns:
      - name: id
        description: Surrogate key on slate_season, user_id, entry_count, cohort_size, round_scope, round_cutoff, cohort_key.
        data_tests:
          - unique
          - not_null
      - name: slate_season
        description: Calendar year of the draft slate.
      - name: user_id
        description: Drafter identifier.
      - name: username
        description: Drafter display name.
      - name: entry_count
        description: Draft size filter used for this cohort (default 12).
      - name: cohort_size
        description: Number of players in the cohort (2 or 3).
      - name: round_scope
        description: Round filter mode; currently always 'through'.
      - name: round_cutoff
        description: Include picks where pick_round_number <= round_cutoff.
      - name: cohort_key
        description: Sorted player_ids joined with '|'.
      - name: player_ids
        description: Canonical ordered list of player_ids in the cohort.
      - name: player_names
        description: Player names in the same order as player_ids, exposed to Lightdash as pipe-delimited text for membership filtering.
      - name: positions
        description: Positions in the same order as player_ids, exposed to Lightdash as pipe-delimited text for membership filtering.
      - name: nfl_teams
        description: NFL team names in the same order as player_ids, exposed to Lightdash as pipe-delimited text for membership filtering.
      - name: draft_ids
        description: Distinct draft_ids that contain this cohort.
      - name: draft_count
        description: Distinct drafts containing this cohort (numerator).
      - name: total_drafts
        description: Distinct full-season drafts for the user/season (denominator).
      - name: exposure_percent
        data_type: numeric
        description: draft_count * 100.0 / total_drafts.
        config:
          meta:
            metrics:
              cohort_exposure:
                type: average
                label: Cohort Exposure
                description: >
                  Percentage of qualifying drafts containing the player
                  cohort. For pair, pairing, duo, or two-player requests,
                  filter cohort_size = 2. For trio or three-player requests,
                  filter cohort_size = 3.
                sql: ${TABLE}.exposure_percent / 100.0
                format: '0.00%'
                tags: ['agent']
