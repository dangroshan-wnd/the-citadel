version: 2

models:
  - name: stg__pfr__box_scores
    description: Staged PFR box scores from base. One row per player per game.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - player
    columns:
      - name: game_id
        description: PFR game identifier.
        data_tests:
          - not_null
      - name: player
        description: Player display name from the PFR offense table.
        data_tests:
          - not_null
      - name: team
        description: Team abbreviation as shown on the box score.
      - name: game_date_long
        description: Game date string as scraped from PFR.
      - name: game_date
        description: Parsed game date.
        data_tests:
          - not_null
      - name: pass_cmp
        description: Pass completions.
      - name: pass_att
        description: Pass attempts.
      - name: pass_yds
        description: Passing yards.
      - name: pass_td
        description: Passing touchdowns.
      - name: pass_int
        description: Interceptions thrown.
      - name: rush_att
        description: Rushing attempts.
      - name: rush_yds
        description: Rushing yards.
      - name: rush_td
        description: Rushing touchdowns.
      - name: targets
        description: Receiving targets.
      - name: rec
        description: Receptions.
      - name: rec_yds
        description: Receiving yards.
      - name: rec_td
        description: Receiving touchdowns.
      - name: fumbles
        description: Fumbles.
      - name: fumbles_lost
        description: Fumbles lost.
      - name: ingested_at
        description: Timestamp when the landing row was ingested.
