version: 2

models:
  - name: base__seed__ud_pfr_name_bridge
    description: Underdog-to-PFR player name bridge from seed CSV. One row per UD player name.
    columns:
      - name: ud_player
        description: Player name as shown on Underdog.
      - name: pfr_player
        description: Matching player name on Pro Football Reference, when mapped.
      - name: player_join_key
        description: Normalized join key used to link UD and PFR player records.
