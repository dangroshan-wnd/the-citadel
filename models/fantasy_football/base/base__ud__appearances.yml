version: 2

models:
  - name: base__ud__appearances
    description: Underdog slate appearances from landing. One row per appearance.
    columns:
      - name: id
        description: Underdog appearance UUID.
      - name: latest_news_item_updated_at
        description: Timestamp of the latest news item for this appearance.
      - name: lineup_status_id
        description: Underdog lineup status UUID.
      - name: match_id
        description: Underdog match UUID.
      - name: match_type
        description: Match type (e.g. Game).
      - name: player_id
        description: Underdog player UUID.
      - name: position_id
        description: Underdog position UUID.
      - name: score
        description: Appearance score value.
      - name: team_id
        description: Underdog team UUID.
      - name: projection_id
        description: Underdog projection UUID from nested projection object.
      - name: adp
        description: Average draft position from projection.
      - name: avg_weekly_points
        description: Average weekly points from projection.
      - name: points
        description: Projected points from projection.
      - name: position_rank
        description: Position rank from projection.
      - name: scoring_type_id
        description: Underdog scoring type UUID from projection.
      - name: slate_id
        description: Underdog slate UUID (landing helper column).
      - name: ingested_at
        description: Timestamp when the landing row was ingested.
