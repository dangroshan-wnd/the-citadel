version: 2

models:
  - name: base__pfr__players
    description: PFR player index records from landing. One row per PFR player URL.
    columns:
      - name: name
        description: Player display name from PFR.
      - name: url
        description: Unique PFR player-page URL.
        data_tests:
          - unique
          - not_null
      - name: position
        description: Player position from PFR.
      - name: from_year
        description: First NFL season listed by PFR.
      - name: to_year
        description: Last NFL season listed by PFR.
      - name: dob
        description: Player date of birth.
      - name: height
        description: Player height as displayed by PFR.
      - name: weight
        description: Player weight as displayed by PFR.
      - name: draft_info
        description: PFR draft description.
      - name: ingested_at
        description: Timestamp when the landing row was ingested.
